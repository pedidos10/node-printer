name: CI for Pull Requests
permissions:
  contents: read

on:
  pull_request:

jobs:
  prebuild:
    name: ${{ matrix.runtime }} ${{ matrix.target }} / ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Electron 15 — o que o PDV carrega em produção
          - { os: windows-latest, arch: x64,   runtime: electron, target: 15.5.5  }
          - { os: macos-latest,   arch: arm64, runtime: electron, target: 15.5.5  }
          - { os: ubuntu-latest,  arch: x64,   runtime: electron, target: 15.5.5  }
          # Windows — o runner que gera o instalador
          - { os: windows-latest, arch: x64,   runtime: node,     target: 22.12.0 }
          - { os: windows-latest, arch: x64,   runtime: node,     target: 24.11.0 }
          # Linux — todo pnpm install do monorepo em CI passa por aqui
          - { os: ubuntu-latest,  arch: x64,   runtime: node,     target: 22.12.0 }
          - { os: ubuntu-latest,  arch: x64,   runtime: node,     target: 24.11.0 }
          # Mac M — devs
          - { os: macos-latest,   arch: arm64, runtime: node,     target: 22.12.0 }
          - { os: macos-latest,   arch: arm64, runtime: node,     target: 24.11.0 }
    timeout-minutes: 30
    steps:
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Setup Dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y g++-multilib gcc-multilib libcups2-dev linux-libc-dev
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: npm i --ignore-scripts
      - run: npm run apply-patches
      - name: Prebuild
        run: >
          npm run prebuild --
          --strip --arch ${{ matrix.arch }}
          -r ${{ matrix.runtime }} -t ${{ matrix.target }}
