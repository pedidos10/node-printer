name: Publish Package to npmjs
permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm publish --access public
        env:
          # Only needed until the package exists on npm and a trusted publisher
          # can be configured; OIDC takes over after that and this can go.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
